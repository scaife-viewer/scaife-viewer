services:
  scaife-viewer:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: scaife-viewer
    command: gunicorn sv_pdl.wsgi:application
    depends_on:
      sv-postgres:
        condition: service_healthy
      sv-elasticsearch:
        condition: service_healthy
    ports:
      - ${SCAIFE_VIEWER_PORT:-8000}:8000
    env_file: .env

  sv-postgres:
    container_name: sv-postgres
    image: postgres:9.6-alpine
    ports:
      - ${SV_POSTGRES_PORT:-5433}:5432
    environment:
      - POSTGRES_USER=scaife
      - POSTGRES_PASSWORD=scaife
      - USE_ELASTICSEARCH_SERVICE=1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - sv-postgres-data:/var/lib/postgresql/data

  sv-elasticsearch:
    build:
      context: ../
      dockerfile: Dockerfile-elasticsearch
    container_name: sv-elasticsearch
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9200:9200
    volumes:
      - sv-elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  sv-postgres-data:
  sv-elasticsearch-data:
